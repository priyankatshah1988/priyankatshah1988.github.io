<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <title>Under Construction</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #252722;
      background: #f5f3ee;
      text-align: center;
    }
    main { max-width: 34rem; }
    .icon { font-size: 3rem; line-height: 1; margin-bottom: 1.5rem; }
    h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: -0.04em; }
    p { margin: 0; color: #62665d; font-size: 1.125rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🛠️</div>
    <h1>Under Construction</h1>
    <p>We’re working on something new. Please check back soon.</p>
  </main>
</body>
</html>
